name: Infra Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Infra/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Bicep Deployment
        uses: azure/bicep-deploy@v2
        with:
          type: deploymentStack
          operation: create
          name: Development
          location: uksouth
          scope: subscription
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          template-file: Infra/main.bicep
          parameters-file: Infra/Params/main.bicepparam
          action-on-unmanage-resources: delete
          action-on-unmanage-resourcegroups: delete
          deny-settings-mode: none


      - name: Configure Container App Registry
        run: |
          az containerapp registry set \
            --name art-auction-api \
            --resource-group MassTransit-Playground \
            --server masstransitcontainerregistry.azurecr.io \
            --identity system

        
