name: Infra Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Infra/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Bicep

    steps:
      - uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Bicep Deployment
        uses: azure/bicep-deploy@v2
        with:
          type: deploymentStack
          operation: create
          name: Development
          location: uksouth
          scope: subscription
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          template-file: Infra/main.bicep
          parameters-file: Infra/Params/main.bicepparam
          action-on-unmanage-resources: delete
          action-on-unmanage-resourcegroups: delete
          deny-settings-mode: none

  configure-container:
    needs: deploy
    runs-on: ubuntu-latest

    strategy:
      matrix:
        containerapp:
          - CA-ARTAUCTIONAPI-NEU-001
          - CA-ARTAUCTIONCONSUMER-NEU-001

    steps:
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Container App Registry
        run: |
          az containerapp registry set \
            --name ${{ matrix.containerapp }} \
            --resource-group  \
            --server ${{ vars.REGISTRY_LOGIN_SERVER }} \
            --identity system
