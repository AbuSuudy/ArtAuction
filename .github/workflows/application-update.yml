name: Application Pipeline 2

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Manage container traffic"
        required: true
        type: choice
        options:
          - build-and-deploy-container
          - switch_traffic
      app_name:
        description: "Container app to update"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - art-auction-api
          - art-auction-consumer

      revision_name:
        description: "Revision to send 100% traffic to"
        required: false
        default: ""
        type: string
  push:
    branches:
      - main
    paths:
      - "ArtAuction.API/**"
      - "ArtAuction.Consumer/**"
      - "ArtAuction.Contract/**"

jobs:
  build-and-deploy-container:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'build-and-deploy-container')
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app:
          - dockerfile: ArtAuction.API/Dockerfile
            containerAppName: art-auction-api
            imageName: art-auction-api

          - dockerfile: ArtAuction.Consumer/Dockerfile
            containerAppName: art-auction-consumer
            imageName: art-auction-consumer

    steps:
      - uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build Container and push to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ vars.REGISTRY_LOGIN_SERVER }}
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - run: |
          docker build \
            -f ${{ matrix.app.dockerfile }} \
            -t ${{ vars.REGISTRY_LOGIN_SERVER }}/${{ matrix.app.imageName }}:${{ github.sha }} \
            .

          docker push \
            ${{ vars.REGISTRY_LOGIN_SERVER }}/${{ matrix.app.imageName }}:${{ github.sha }}

      - name: Deploy to Container to inactive revision
        shell: bash
        run: |
            set -euo pipefail

            APP_NAME="${{ matrix.app.containerAppName }}"
            RG="${{ vars.RESOURCE_GROUP }}"
            IMAGE="${{ vars.REGISTRY_LOGIN_SERVER }}/${{ matrix.app.imageName }}:${{ github.sha }}"

            CURRENT_LIVE=$(az containerapp ingress traffic show \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --query "[?weight==\`100\`].revisionName | [0]" \
                -o tsv)

            #keep traffic to existing container
            if [[ ! -z "$CURRENT_LIVE" ]]; then
            
                previous_revision_name=$(az containerapp revision list \
                    --name "$APP_NAME" \
                    --resource-group "$RG" \
                    --query '[?properties.trafficWeight==`100`].name | [0]' \
                    -o tsv)

                az containerapp ingress traffic set \
                    --name "$APP_NAME" \
                    --resource-group "$RG" \
                    --revision-weight "$previous_revision_name=100"
            fi

            #update and return revsion name
            latestRevisionName=""

            echo "Waiting for new revision to be provisioned..."
            for _ in {1..60}; do
            latestRevisionName=$(az containerapp show \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --query "properties.latestRevisionName" \
                -o tsv)

            if [[ -n "$latest" && "$latest" != "$previous_revision_name" ]] && \
                [[ "$(az containerapp revision show \
                        --name "$APP_NAME" \
                        --resource-group "$RG" \
                        --revision "$latest" \
                        --query "properties.provisioningState" \
                        -o tsv)" == "Provisioned" ]]; then          
                break
            fi

            sleep 5
            done

            blue_weight=$(az containerapp show \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --query "properties.configuration.ingress.traffic[?label=='blue'].weight | [0]" \
                -o tsv)

            green_weight=$(az containerapp show \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --query "properties.configuration.ingress.traffic[?label=='green'].weight | [0]" \
                -o tsv)

            deploy_label=$(( blue_weight == 100)) && deploy_label="green" || deploy_label="blue"

            az containerapp revision label add \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --label "$deploy_label" \
                --revision "latestRevisionName" \
                --yes

            #Remove container app revisions older than 7 days that are not blue or green
            cutoff=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%S)

            blue_revision=$(az containerapp ingress traffic show \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --query "[?label=='blue'].revisionName | [0]" \
                -o tsv)

            green_revision=$(az containerapp ingress traffic show \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --query "[?label=='green'].revisionName | [0]" \
                -o tsv)

            az containerapp revision list \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                -o json |
            jq -c '.[] | {revision: .name, created: .properties.createdTime}' |
            while read -r rev; do
                revision=$(jq -r '.revision' <<< "$rev")
                created=$(jq -r '.created' <<< "$rev")

                [[ "$created" > "$cutoff" ]] && continue
                [[ "$revision" == "$blue_revision" ]] && continue
                [[ "$revision" == "$green_revision" ]] && continue

                echo "Deactivating $revision"

                az containerapp revision deactivate \
                    --name "$APP_NAME" \
                    --resource-group "$RG" \
                    --revision "$revision"
            done


  switch_traffic:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'switch_traffic' && github.event.inputs.app_name != ''
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Promote selected revision to 100% traffic
        shell: bash
        run: |
          set -euo pipefail

          APP_NAME="${{ github.event.inputs.app_name }}"
          REVISION_NAME="${{ github.event.inputs.revision_name }}"
          RG="${{ vars.RESOURCE_GROUP }}"

          blue_weight=$(az containerapp show -n "$APP_NAME" -g "$RG" \
            --query "properties.configuration.ingress.traffic[?label=='blue'].weight | [0]" -o tsv)

          green_weight=$(az containerapp show -n "$APP_NAME" -g "$RG" \
            --query "properties.configuration.ingress.traffic[?label=='green'].weight | [0]" -o tsv)

          deploy_label=$(( blue_weight == 100)) && deploy_label="green" || deploy_label="blue"

          ZEROED=$(az containerapp revision list -n "$APP_NAME" -g "$RG" \
            --query "[?properties.active && name != '$REVISION_NAME'].name" -o tsv | sed 's/$/=0/')

          az containerapp ingress traffic set -n "$APP_NAME" -g "$RG" \
            --revision-weight latest=0 $ZEROED "$REVISION_NAME=100"

          current_label=$(az containerapp show -n "$APP_NAME" -g "$RG" \
            --query "properties.configuration.ingress.traffic[?revisionName=='$REVISION_NAME'].label | [0]" -o tsv)

          if [[ -z "$current_label" ]]; then
              az containerapp revision label add \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --label "$deploy_label" \
                --revision "$REVISION_NAME" \
                --yes
          fi