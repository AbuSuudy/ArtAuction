name: Application Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ArtAuction.API/**"
      - "ArtAuction.Consumer/**"
      - "ArtAuction.Contract/**"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app:
          - dockerfile: ArtAuction.API/Dockerfile
            containerAppName: art-auction-api
            imageName: art-auction-api

          - dockerfile: ArtAuction.Consumer/Dockerfile
            containerAppName: art-auction-consumer
            imageName: art-auction-consumer

    steps:
      - uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image
        uses: azure/docker-login@v1
        with:
          login-server: ${{ vars.REGISTRY_LOGIN_SERVER }}
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - run: |
          docker build \
            -f ${{ matrix.app.dockerfile }} \
            -t ${{ vars.REGISTRY_LOGIN_SERVER }}/${{ matrix.app.imageName }}:${{ github.sha }} \
            .

          docker push \
            ${{ vars.REGISTRY_LOGIN_SERVER }}/${{ matrix.app.imageName }}:${{ github.sha }}

      - name: Deploy to Container App
        shell: bash
        run: |
          set -euo pipefail

          APP_NAME="${{ matrix.app.containerAppName }}"
          RG="${{ vars.RESOURCE_GROUP }}"
          IMAGE="${{ vars.REGISTRY_LOGIN_SERVER }}/${{ matrix.app.imageName }}:${{ github.sha }}"

          echo "=================================================="
          echo "Deploying Container App: $APP_NAME"
          echo "Image: $IMAGE"
          echo "=================================================="

          # ------------------------------------------------
          # Get the currently labelled blue and green revisions
          # ------------------------------------------------

          blueRevision=$(az containerapp ingress traffic show \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "[?label=='blue'].revisionName | [0]" \
            -o tsv || true)

          greenRevision=$(az containerapp ingress traffic show \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "[?label=='green'].revisionName | [0]" \
            -o tsv || true)

          echo "Current Blue revision: ${blueRevision:-<none>}"
          echo "Current Green revision: ${greenRevision:-<none>}"

          # ------------------------------------------------
          # Decide which slot receives the deployment
          #
          # We do NOT use traffic weight here.
          #
          # First deployment:
          #   Deploy to BLUE
          #
          # If only BLUE exists:
          #   Deploy to GREEN
          #
          # If only GREEN exists:
          #   Deploy to BLUE
          #
          # If both exist:
          #   Deploy to the slot with the older revision.
          # ------------------------------------------------

          if [ -z "$blueRevision" ] && [ -z "$greenRevision" ]; then

            DEPLOY_LABEL="blue"
            PREVIOUS_LABEL="none"

            echo "First deployment - deploying to BLUE."

          elif [ -n "$blueRevision" ] && [ -z "$greenRevision" ]; then

            DEPLOY_LABEL="green"
            PREVIOUS_LABEL="blue"

            echo "Only BLUE exists - deploying to GREEN."

          elif [ -z "$blueRevision" ] && [ -n "$greenRevision" ]; then

            DEPLOY_LABEL="blue"
            PREVIOUS_LABEL="green"

            echo "Only GREEN exists - deploying to BLUE."

          else

            # Get creation timestamps for both slot revisions
            blueCreated=$(az containerapp revision show \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --revision "$blueRevision" \
              --query "properties.createdTime" \
              -o tsv)

            greenCreated=$(az containerapp revision show \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --revision "$greenRevision" \
              --query "properties.createdTime" \
              -o tsv)

            echo "Blue created:  $blueCreated"
            echo "Green created: $greenCreated"

            # Deploy to the older slot
            #
            # ISO timestamps can be compared lexicographically.
            if [[ "$blueCreated" < "$greenCreated" ]]; then

              DEPLOY_LABEL="blue"
              PREVIOUS_LABEL="green"

              echo "BLUE is older - deploying to BLUE."

            else

              DEPLOY_LABEL="green"
              PREVIOUS_LABEL="blue"

              echo "GREEN is older - deploying to GREEN."

            fi
          fi

          echo "--------------------------------------------------"
          echo "Deploy label: $DEPLOY_LABEL"
          echo "Previous label: $PREVIOUS_LABEL"
          echo "--------------------------------------------------"

          # ------------------------------------------------
          # Capture the current latest revision before update
          # ------------------------------------------------

          previousLatestRevision=$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "properties.latestRevisionName" \
            -o tsv)

          echo "Previous latest revision: ${previousLatestRevision:-<none>}"

          # ------------------------------------------------
          # Deploy new image
          # ------------------------------------------------

          echo "Deploying new image..."

          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --image "$IMAGE"

          echo "Waiting for new revision to be created..."

          # ------------------------------------------------
          # Wait for a NEW revision to appear
          #
          # This avoids immediately using the old revision.
          # ------------------------------------------------

          latestRevision=""

          for attempt in {1..60}
          do

            latestRevision=$(az containerapp show \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --query "properties.latestRevisionName" \
              -o tsv)

            echo "Attempt $attempt - Latest revision: $latestRevision"

            if [ -n "$latestRevision" ] && \
              [ "$latestRevision" != "$previousLatestRevision" ]; then

              echo "New revision detected: $latestRevision"
              break

            fi

            sleep 5
          done

          if [ -z "$latestRevision" ] || \
            [ "$latestRevision" = "$previousLatestRevision" ]; then

            echo "ERROR: Timed out waiting for a new revision."
            exit 1
          fi

          # ------------------------------------------------
          # Wait for provisioning
          # ------------------------------------------------

          echo "Waiting for revision to be provisioned..."

          for attempt in {1..120}
          do

            state=$(az containerapp revision show \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --revision "$latestRevision" \
              --query "properties.provisioningState" \
              -o tsv)

            echo "Revision: $latestRevision"
            echo "Provisioning state: $state"

            if [ "$state" = "Provisioned" ]; then

              echo "Revision successfully provisioned."
              break

            fi

            if [ "$state" = "Failed" ]; then

              echo "ERROR: Revision provisioning failed."
              exit 1

            fi

            sleep 10
          done

          if [ "$state" != "Provisioned" ]; then

            echo "ERROR: Timed out waiting for revision provisioning."
            exit 1

          fi

          # ------------------------------------------------
          # Assign deployment label to the new revision
          # ------------------------------------------------

          echo "Assigning label '$DEPLOY_LABEL' to revision '$latestRevision'..."

          az containerapp revision label add \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --label "$DEPLOY_LABEL" \
            --revision "$latestRevision" \
            --yes

          # ------------------------------------------------
          # Re-read the labels after assignment
          #
          # IMPORTANT:
          # Do this before cleanup so we know exactly which
          # revisions must be retained.
          # ------------------------------------------------

          echo "Verifying Blue and Green revisions..."

          blueRevision=$(az containerapp ingress traffic show \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "[?label=='blue'].revisionName | [0]" \
            -o tsv || true)

          greenRevision=$(az containerapp ingress traffic show \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "[?label=='green'].revisionName | [0]" \
            -o tsv || true)

          echo "Blue revision:  ${blueRevision:-<none>}"
          echo "Green revision: ${greenRevision:-<none>}"

          # ------------------------------------------------
          # Validate the label assignment
          # ------------------------------------------------

          if [ "$DEPLOY_LABEL" = "blue" ] && \
            [ "$blueRevision" != "$latestRevision" ]; then

            echo "ERROR: BLUE label was not assigned to the new revision."
            exit 1

          fi

          if [ "$DEPLOY_LABEL" = "green" ] && \
            [ "$greenRevision" != "$latestRevision" ]; then

            echo "ERROR: GREEN label was not assigned to the new revision."
            exit 1

          fi

          echo "Label assignment verified."

          # ------------------------------------------------
          # Keep only Blue and Green slot revisions
          #
          # Do NOT clean up unless we have at least one
          # valid labelled revision.
          # ------------------------------------------------

          if [ -z "$blueRevision" ] && [ -z "$greenRevision" ]; then

            echo "ERROR: No Blue or Green revisions found."
            echo "Refusing to deactivate revisions."
            exit 1

          fi

          #Set previous latest to 100
          az containerapp ingress traffic set \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --label-weight "$PREVIOUS_LABEL=100"


          echo "--------------------------------------------------"
          echo "Cleaning up old revisions..."
          echo "--------------------------------------------------"

          allRevisions=$(az containerapp revision list \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "[].name" \
            -o tsv)

          for revision in $allRevisions
          do

            if [ "$revision" = "$blueRevision" ] || \
              [ "$revision" = "$greenRevision" ]; then

              echo "Keeping deployment slot revision: $revision"

            else

              echo "Deactivating old revision: $revision"

              az containerapp revision deactivate \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --revision "$revision" \
                || echo "WARNING: Failed to deactivate revision $revision"

            fi

          done

          echo "=================================================="
          echo "Deployment complete"
          echo "Blue revision:  ${blueRevision:-<none>}"
          echo "Green revision: ${greenRevision:-<none>}"
          echo "New revision:   $latestRevision"
          echo "=================================================="