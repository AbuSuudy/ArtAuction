name: Application Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ArtAuction.API/**"
      - "ArtAuction.Consumer/**"
      - "ArtAuction.Contract/**"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app:
          - dockerfile: ArtAuction.API/Dockerfile
            containerAppName: art-auction-api
            imageName: art-auction-api

          - dockerfile: ArtAuction.Consumer/Dockerfile
            containerAppName: art-auction-consumer
            imageName: art-auction-consumer

    steps:
      - uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image
        uses: azure/docker-login@v1
        with:
          login-server: ${{ vars.REGISTRY_LOGIN_SERVER }}
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - run: |
          docker build \
            -f ${{ matrix.app.dockerfile }} \
            -t ${{ vars.REGISTRY_LOGIN_SERVER }}/${{ matrix.app.imageName }}:${{ github.sha }} \
            .

          docker push \
            ${{ vars.REGISTRY_LOGIN_SERVER }}/${{ matrix.app.imageName }}:${{ github.sha }}

      - name: Deploy to Container App
        shell: bash
        run: |
          set -euo pipefail

          APP_NAME="${{ matrix.app.containerAppName }}"
          RG="${{ vars.RESOURCE_GROUP }}"
          IMAGE="${{ vars.REGISTRY_LOGIN_SERVER }}/${{ matrix.app.imageName }}:${{ github.sha }}"

          # Determine which slot is currently live
          blueWeight=$(az containerapp ingress traffic show \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "[?label=='blue'].weight | [0]" \
            -o tsv)

          greenWeight=$(az containerapp ingress traffic show \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "[?label=='green'].weight | [0]" \
            -o tsv)

          if [ "$blueWeight" = "100" ]; then
            DEPLOY_LABEL="green"
            LIVE_LABEL="blue"
          elif [ "$greenWeight" = "100" ]; then
            DEPLOY_LABEL="blue"
            LIVE_LABEL="green"
          else
            # First deployment
            DEPLOY_LABEL="blue"
            LIVE_LABEL="none"
          fi

          echo "Live slot: $LIVE_LABEL"
          echo "Deploying into slot: $DEPLOY_LABEL"

          # Deploy new image
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --image "$IMAGE"

          # Get new revision
          latestRevision=$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query properties.latestRevisionName \
            -o tsv)

          echo "Latest revision: $latestRevision"

          # Wait for revision provisioning
          while true; do
            provisionState=$(az containerapp revision show \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --revision "$latestRevision" \
              --query properties.provisioningState \
              -o tsv)

            echo "Revision state: $provisionState"

            if [ "$provisionState" = "Provisioned" ]; then
              break
            fi

            if [ "$provisionState" = "ProvisioningFailed" ]; then
              echo "Revision provisioning failed."
              exit 1
            fi

            sleep 10
          done

          # Assign the deployment label to the new revision
          az containerapp revision label add \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --label "$DEPLOY_LABEL" \
            --revision "$latestRevision" \
            --yes

          echo "Assigned $DEPLOY_LABEL to $latestRevision"

          # Get current blue and green revisions
          blueRevision=$(az containerapp ingress traffic show \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "[?label=='blue'].revisionName | [0]" \
            -o tsv)

          greenRevision=$(az containerapp ingress traffic show \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "[?label=='green'].revisionName | [0]" \
            -o tsv)

          echo "Blue revision: ${blueRevision:-<none>}"
          echo "Green revision: ${greenRevision:-<none>}"

          # Keep only the blue and green slot revisions
          allRevisions=$(az containerapp revision list \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "[].name" \
            -o tsv)

          for revision in $allRevisions
          do
            if [ "$revision" != "$blueRevision" ] && [ "$revision" != "$greenRevision" ]; then
              echo "Deactivating old revision: $revision"

              az containerapp revision deactivate \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --revision "$revision"
            else
              echo "Keeping deployment slot revision: $revision"
            fi
          done

          echo "Deployment complete"
