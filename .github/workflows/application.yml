name: Application Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ArtAuction.API/**"
      - "ArtAuction.Consumer/**"
      - "ArtAuction.Contract/**"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app:
          - dockerfile: ArtAuction.API/Dockerfile
            containerAppName: art-auction-api
            imageName: art-auction-api

          - dockerfile: ArtAuction.Consumer/Dockerfile
            containerAppName: art-auction-consumer
            imageName: art-auction-consumer

    steps:
      - uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Assumes image is already built and pushed to ACR elsewhere in your pipeline.
      - name: Blue/Green deploy via az CLI
        env:
          RESOURCE_GROUP: MassTransit-Playground
        run: |
          set -euo pipefail

          APP=${{ matrix.app.containerAppName }}
          IMAGE=masstransitcontainerregistry.azurecr.io/${{ matrix.app.imageName }}:${{ github.sha }}
          RG="${RESOURCE_GROUP}"
          SHORT_SHA="${GITHUB_SHA:0:8}"
          NEW_REV="${APP}--${SHORT_SHA}"

          # Ensure Container Apps extension and multiple revision mode
          az extension add --name containerapp --upgrade --allow-preview true || true
          az containerapp revision set-mode --name "$APP" --resource-group "$RG" --mode multiple || true

          # Deploy new revision (uses image already in ACR)
          az containerapp update \
            --name "$APP" \
            --resource-group "$RG" \
            --image "$IMAGE" \
            --revision-suffix "$SHORT_SHA"

          # Label new revision as 'green'
          az containerapp revision label add \
            --name "$APP" \
            --resource-group "$RG" \
            --revision "$NEW_REV" \
            --label green || true

          # If an existing 'blue' label exists, switch traffic by label; otherwise set by revision name
          BLUE_REV=$(az containerapp label-history show --name "$APP" --resource-group "$RG" --label blue --query "[0].revision" -o tsv || echo "")

          if [ -n "$BLUE_REV" ]; then
            az containerapp ingress traffic set \
              --name "$APP" \
              --resource-group "$RG" \
              --label-weight blue=0 green=100
          else
            az containerapp ingress traffic set \
              --name "$APP" \
              --resource-group "$RG" \
              --revision-weight "${NEW_REV}=100"
          fi