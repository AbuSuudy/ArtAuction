name: Application Pipeline

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Manage container traffic"
        required: true
        type: choice
        options:
          - build
          - promote
          - rollback
      app_name:
        description: "Container app to update"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - art-auction-api
          - art-auction-consumer
  push:
    branches:
      - main
    paths:
      - "ArtAuction.API/**"
      - "ArtAuction.Consumer/**"
      - "ArtAuction.Contract/**"

jobs:
  build:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'build')
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app:
          - dockerfile: ArtAuction.API/Dockerfile
            containerAppName: art-auction-api
            imageName: art-auction-api

          - dockerfile: ArtAuction.Consumer/Dockerfile
            containerAppName: art-auction-consumer
            imageName: art-auction-consumer

    steps:
      - uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image
        uses: azure/docker-login@v1
        with:
          login-server: ${{ vars.REGISTRY_LOGIN_SERVER }}
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - run: |
          docker build \
            -f ${{ matrix.app.dockerfile }} \
            -t ${{ vars.REGISTRY_LOGIN_SERVER }}/${{ matrix.app.imageName }}:${{ github.sha }} \
            .

          docker push \
            ${{ vars.REGISTRY_LOGIN_SERVER }}/${{ matrix.app.imageName }}:${{ github.sha }}

      - name: Deploy to Container App
        shell: bash
        run: |
          set -euo pipefail

          APP_NAME="${{ matrix.app.containerAppName }}"
          RG="${{ vars.RESOURCE_GROUP }}"
          IMAGE="${{ vars.REGISTRY_LOGIN_SERVER }}/${{ matrix.app.imageName }}:${{ github.sha }}"

          # Get current Blue/Green revisions
          blue=$(az containerapp ingress traffic show \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "[?label=='blue'].revisionName | [0]" \
            -o tsv || true)

          green=$(az containerapp ingress traffic show \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "[?label=='green'].revisionName | [0]" \
            -o tsv || true)

          # Decide which slot receives the deployment
          if [[ -z "$blue" && -z "$green" ]]; then
            # First deployment
            deploy_label="blue"
            previous_label="none"

          elif [[ -n "$blue" && -z "$green" ]]; then
            # Second Deployment: Blue exists, so deploy to Green
            deploy_label="green"
            previous_label="blue"

          else
            # Both exist - deploy to the older slot
            blue_created=$(az containerapp revision show \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --revision "$blue" \
              --query "properties.createdTime" \
              -o tsv)

            green_created=$(az containerapp revision show \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --revision "$green" \
              --query "properties.createdTime" \
              -o tsv)

            if [[ "$blue_created" < "$green_created" ]]; then
              deploy_label="blue"
              previous_label="green"
            else
              deploy_label="green"
              previous_label="blue"
            fi

          fi

          echo "Deploying to: $deploy_label"
          echo "Current production slot: $previous_label"

          # Remember the current latest revision
          previous_latest=$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "properties.latestRevisionName" \
            -o tsv)
          echo "Previous latest revision: $previous_latest"

          # Deploy the new image
          echo "Updating container app $APP_NAME with image $IMAGE"
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --image "$IMAGE"

          # Wait for a new revision to appear
          latest=""

          echo "Waiting for new revision to be provisioned..."
          for _ in {1..60}; do
            latest=$(az containerapp show \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --query "properties.latestRevisionName" \
              -o tsv)

            if [[ -n "$latest" && "$latest" != "$previous_latest" ]] && \
               [[ "$(az containerapp revision show \
                      --name "$APP_NAME" \
                      --resource-group "$RG" \
                      --revision "$latest" \
                      --query "properties.provisioningState" \
                      -o tsv)" == "Provisioned" ]]; then          
              break
            fi

            sleep 5
          done

          echo "New revision provisioned: $latest"
          # Assign Blue/Green label to the new revision
          az containerapp revision label add \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --label "$deploy_label" \
            --revision "$latest" \
            --yes

          # Keep the previous production slot at 100% traffic
          blue=$(az containerapp ingress traffic show \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "[?label=='blue'].revisionName | [0]" \
            -o tsv || true)

          green=$(az containerapp ingress traffic show \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "[?label=='green'].revisionName | [0]" \
            -o tsv || true)

          echo updating traffic weights to stay in old container revision
          if [[ "$previous_label" == "blue" ]]; then
            az containerapp ingress traffic set \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --revision-weight "$blue=100"

          elif [[ "$previous_label" == "green" ]]; then
            az containerapp ingress traffic set \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --revision-weight "$green=100"
          fi

          echo "Cleaning up old revisions"
          for revision in $(az containerapp revision list \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "[].name" \
            -o tsv); do

            if [[ "$revision" != "$blue" && "$revision" != "$green" ]]; then
              echo "Deactivating $revision"
              az containerapp revision deactivate \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --revision "$revision"
            fi
          done

          echo "Deployment complete"
          echo "Blue:  ${blue:-<none>}"
          echo "Green: ${green:-<none>}"
          echo "New:   $latest"

  promote:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'promote' && github.event.inputs.app_name != ''
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Promote latest revision to 100%
        shell: bash
        run: |
          set -euo pipefail

          APP_NAME="${{ github.event.inputs.app_name }}"
          RG="${{ vars.RESOURCE_GROUP }}"

          latest=$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "properties.latestRevisionName" \
            -o tsv)

          echo "Promoting: routing 100% traffic to $latest"

          az containerapp ingress traffic set \
            --name "$APP_NAME" --resource-group "$RG" \
            --revision-weight "$latest=100"

          echo "Promote done. $latest is now serving 100% of traffic."

  rollback:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback' && github.event.inputs.app_name != ''
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Rollback to previous revision
        shell: bash
        run: |
          set -euo pipefail

          APP_NAME="${{ github.event.inputs.app_name }}"
          RG="${{ vars.RESOURCE_GROUP }}"

          previousRevision=$(az containerapp revision list \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "sort_by(@,&properties.createdTime)[-2].name" \
            -o tsv)

          if [[ -z "$previousRevision" ]]; then
            echo "No previous revision found."
            exit 1
          fi

          az containerapp ingress traffic set \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --revision-weight "$previousRevision=100"

          echo "Rollback done. $previousRevision is now serving 100% of traffic."