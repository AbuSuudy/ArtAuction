name: Worker Container Pipeline

on:
  workflow_dispatch:
    inputs:

      action:
        description: "Manage container traffic"
        required: true
        type: choice
        options:
          - build_and_deploy_container
          - rollback_to_revision

      app_name:
        description: "Container app to update"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - ca-artauctionconsumer-neu-001

      revision_name:
        description: "Revision whose image to redeploy (the consumer runs in Single revision mode, so this redeploys that revision's image as a new revision rather than activating the old one)"
        required: false
        default: ""
        type: string

  push:
    branches:
      - main
    paths:
      - "src/ArtAuction.Consumer/**"
      - "src/ArtAuction.Contract/**"

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Validate & Push Consumer Image
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'build_and_deploy_container')
    uses: ./.github/workflows/_build-and-push.yml
    with:
      dockerfile: src/ArtAuction.Consumer/Dockerfile
      image-name: ca-artauctionconsumer-neu-001

  deploy:
    name: Deploy Worker Container
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy worker container
        shell: bash
        env:
          APP_NAME: ca-artauctionconsumer-neu-001
          RG: ${{ vars.RESOURCE_GROUP }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
            set -euo pipefail

            az containerapp update \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --image "$IMAGE" \
              --revision-suffix "sha-${GITHUB_SHA::7}" \
              -o tsv

  rollback_to_revision:
    name: Rollback to Previous Image
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback_to_revision' && github.event.inputs.app_name != '' && github.event.inputs.revision_name != ''
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Redeploy the image from the chosen revision
        shell: bash
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          REVISION_NAME: ${{ github.event.inputs.revision_name }}
          RG: ${{ vars.RESOURCE_GROUP }}
        run: |
            set -euo pipefail

            # In Single revision mode, only the latest revision ever serves
            # traffic, so "activating" an old revision is not a rollback.
            # Instead, pull that revision's image and redeploy it as a new
            # (now-latest) revision.
            rollback_image=$(az containerapp revision show \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --revision "$REVISION_NAME" \
              --query "properties.template.containers[0].image" \
              -o tsv)

            if [[ -z "$rollback_image" ]]; then
                echo "Could not resolve an image for revision $REVISION_NAME." >&2
                exit 1
            fi

            echo "Rolling back $APP_NAME to image $rollback_image (from revision $REVISION_NAME)"

            az containerapp update \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --image "$rollback_image" \
              --revision-suffix "rollback-$(date +%Y%m%d%H%M%S)" \
              -o tsv
