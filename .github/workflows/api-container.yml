name: API Container Pipeline

on:
  workflow_dispatch:
    inputs:

      action:
        description: "Manage container traffic"
        required: true
        type: choice
        options:
          - build_and_deploy_container
          - switch_traffic

      app_name:
        description: "Container app to update"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - ca-artauctionapi-neu-001

      revision_name:
        description: "Revision to send 100% traffic to"
        required: false
        default: ""
        type: string

  push:
    branches:
      - main
    paths:
      - "ArtAuction.API/**"
      - "ArtAuction.Contract/**"

permissions:
  id-token: write
  contents: read

jobs:
  build:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'build_and_deploy_container')
    uses: ./.github/workflows/_build-and-push.yml
    with:
      dockerfile: ArtAuction.API/Dockerfile
      image-name: ca-artauctionapi-neu-001

  deploy:
    name: Deploy to Inactive Revision & Smoke Test
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API container to inactive revision
        shell: bash
        env:
          APP_NAME: ca-artauctionapi-neu-001
          RG: ${{ vars.RESOURCE_GROUP }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
            set -euo pipefail

            current_live=$(az containerapp revision list \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --query '[?properties.trafficWeight==`100`].name | [0]' \
                -o tsv)

            #keep traffic to existing container
            if [[ "$current_live" == *sha* ]]; then
                az containerapp ingress traffic set \
                    --name "$APP_NAME" \
                    --resource-group "$RG" \
                    --revision-weight "$current_live=100"
            fi

            #update container app with new image and revision suffix
            latest_revision_name=$(az containerapp update \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --image "$IMAGE" \
              --revision-suffix "sha-${GITHUB_SHA::7}" \
              --query "properties.latestRevisionName" \
              -o tsv)

            echo "latest_revision_name=$latest_revision_name" >> "$GITHUB_ENV"

      - name: Smoke test new revision before it can receive traffic
        shell: bash
        env:
          APP_NAME: ca-artauctionapi-neu-001
          RG: ${{ vars.RESOURCE_GROUP }}
        run: |
            set -euo pipefail

            revision_fqdn=$(az containerapp revision show \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --revision "$latest_revision_name" \
                --query "properties.fqdn" \
                -o tsv)

            if [[ -z "$revision_fqdn" ]]; then
                echo "Revision $latest_revision_name has no per-revision FQDN; cannot smoke test." >&2
                exit 1
            fi

            url="https://$revision_fqdn/health/ready"
            echo "Smoke testing $url"

            for attempt in $(seq 1 10); do
                if curl -fsS --max-time 5 "$url" > /dev/null; then
                    echo "Smoke test passed on attempt $attempt."
                    exit 0
                fi
                echo "Attempt $attempt failed, retrying in 5s..."
                sleep 5
            done

            echo "Smoke test against $url did not succeed after 10 attempts." >&2
            exit 1

      - name: Label revision and retire old ones
        shell: bash
        env:
          APP_NAME: ca-artauctionapi-neu-001
          RG: ${{ vars.RESOURCE_GROUP }}
        run: |
            set -euo pipefail

            blue_weight=$(az containerapp show \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --query "properties.configuration.ingress.traffic[?label=='blue'].weight | [0]" \
                -o tsv)

            green_weight=$(az containerapp show \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --query "properties.configuration.ingress.traffic[?label=='green'].weight | [0]" \
                -o tsv)

            (( blue_weight == 100 )) && deploy_label="green" || deploy_label="blue"

            az containerapp revision label add \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --label "$deploy_label" \
                --revision "$latest_revision_name" \
                --yes

            #Remove container app revisions older than 7 days that are not blue or green
            cutoff=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%S)

            blue_revision=$(az containerapp ingress traffic show \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --query "[?label=='blue'].revisionName | [0]" \
                -o tsv)

            green_revision=$(az containerapp ingress traffic show \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --query "[?label=='green'].revisionName | [0]" \
                -o tsv)

            az containerapp revision list \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                -o json |
            jq -c '.[] | {revision: .name, created: .properties.createdTime}' |
            while read -r rev; do
                revision=$(jq -r '.revision' <<< "$rev")
                created=$(jq -r '.created' <<< "$rev")

                [[ "$created" > "$cutoff" ]] && continue
                [[ "$revision" == "$blue_revision" ]] && continue
                [[ "$revision" == "$green_revision" ]] && continue

                echo "Deactivating $revision"

                az containerapp revision deactivate \
                    --name "$APP_NAME" \
                    --resource-group "$RG" \
                    --revision "$revision"
            done

  switch_traffic:
    name: Switch Traffic to Revision
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'switch_traffic' && github.event.inputs.app_name != '' && github.event.inputs.revision_name != ''
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Promote selected revision to 100% traffic
        shell: bash
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          REVISION_NAME: ${{ github.event.inputs.revision_name }}
          RG: ${{ vars.RESOURCE_GROUP }}
        run: |
            set -euo pipefail

            blue_weight=$(az containerapp show -n "$APP_NAME" -g "$RG" \
            --query "properties.configuration.ingress.traffic[?label=='blue'].weight | [0]" -o tsv)

            green_weight=$(az containerapp show -n "$APP_NAME" -g "$RG" \
            --query "properties.configuration.ingress.traffic[?label=='green'].weight | [0]" -o tsv)

            (( blue_weight == 100 )) && deploy_label="green" || deploy_label="blue"

            ZEROED=$(az containerapp revision list -n "$APP_NAME" -g "$RG" \
            --query "[?properties.active && name != '$REVISION_NAME'].name" -o tsv | sed 's/$/=0/')

            az containerapp ingress traffic set -n "$APP_NAME" -g "$RG" \
            --revision-weight latest=0 $ZEROED "$REVISION_NAME=100"

            current_label=$(az containerapp show -n "$APP_NAME" -g "$RG" \
            --query "properties.configuration.ingress.traffic[?revisionName=='$REVISION_NAME'].label | [0]" -o tsv)

            if [[ -z "$current_label" ]]; then
                az containerapp revision label add \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --label "$deploy_label" \
                --revision "$REVISION_NAME" \
                --yes
            fi
