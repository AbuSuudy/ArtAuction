name: Application Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ArtAuction.API/**"
      - "ArtAuction.Consumer/**"
      - "ArtAuction.Contract/**"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app:
          - dockerfile: ArtAuction.API/Dockerfile
            containerAppName: art-auction-api
            imageName: art-auction-api

          - dockerfile: ArtAuction.Consumer/Dockerfile
            containerAppName: art-auction-consumer
            imageName: art-auction-consumer

    steps:
      - uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        uses: azure/docker-login@v1
        with:
          login-server: masstransitcontainerregistry.azurecr.io

      - name: Build and push image to ACR
        uses: azure/container-apps-deploy-action@v1
        with:
          context: ${{ github.workspace }}
          file: ${{ matrix.app.dockerfile }}
          push: true
          tags: masstransitcontainerregistry.azurecr.io/${{ matrix.app.imageName }}:${{ github.sha }}
          platforms: linux/amd64

      - name: Blue-Green deploy to Azure Container Apps
        shell: bash
        env:
          RESOURCE_GROUP: MassTransit-Playground
          APP_NAME: ${{ matrix.app.containerAppName }}
          IMAGE: masstransitcontainerregistry.azurecr.io/${{ matrix.app.imageName }}:${{ github.sha }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # create a safe suffix using short sha
          SHORT=${SHORT_SHA:0:7}
          NEW_SUFFIX="green-${SHORT}"
          NEW_REVISION_NAME="${APP_NAME}--${NEW_SUFFIX}"

          # enable multiple revisions and limit inactive revisions to 1 (keeps only current + 1 inactive)
          az containerapp revision set-mode --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --mode multiple

          # update the container app with the new image and revision suffix and enforce max inactive revisions = 1
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --image "$IMAGE" \
            --revision-suffix "$NEW_SUFFIX" \
            --revisions-mode multiple \
            --max-inactive-revisions 1

          # label the new revision as 'green'
          az containerapp revision label add --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --label green --revision "$NEW_REVISION_NAME" || true

          # find the previous revision (the most recent revision that is not the new one) and label it 'blue'
          PREV_REV=$(az containerapp revision list -g "$RESOURCE_GROUP" -n "$APP_NAME" --query "[?name!='$NEW_REVISION_NAME'] | sort_by(@,&createdTime) | [-1].name" -o tsv || true)
          if [ -n "$PREV_REV" ]; then
            az containerapp revision label add --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --label blue --revision "$PREV_REV" || true
          fi

          # Keep traffic on blue by default (safe: green receives 0%). To switch traffic to green, run:
          # az containerapp ingress traffic set --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --label-weight blue=0 green=100
          az containerapp ingress traffic set --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --label-weight blue=100 green=0 || true
