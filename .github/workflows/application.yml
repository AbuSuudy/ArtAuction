name: Application Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ArtAuction.API/**"
      - "ArtAuction.Consumer/**"
      - "ArtAuction.Contract/**"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app:
          - dockerfile: ArtAuction.API/Dockerfile
            containerAppName: art-auction-api
            imageName: art-auction-api

          - dockerfile: ArtAuction.Consumer/Dockerfile
            containerAppName: art-auction-consumer
            imageName: art-auction-consumer

    steps:
      - uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image
        uses: azure/docker-login@v1
        with:
          login-server: ${{ vars.REGISTRY_LOGIN_SERVER }}
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - run: |
          docker build \
            -f ${{ matrix.app.dockerfile }} \
            -t ${{ vars.REGISTRY_LOGIN_SERVER }}/${{ matrix.app.imageName }}:${{ github.sha }} \
            .

          docker push \
            ${{ vars.REGISTRY_LOGIN_SERVER }}/${{ matrix.app.imageName }}:${{ github.sha }}

      - name: Deploy to Container App
        shell: bash
        run: |
          APP_NAME="${{ matrix.app.containerAppName }}"
          RG="${{ vars.RESOURCE_GROUP }}"
          IMAGE="${{ vars.REGISTRY_LOGIN_SERVER }}/${{ matrix.app.imageName }}:${{ github.sha }}"

          # Capture current blue revision before deployment
          currentBlue=$(az containerapp ingress traffic show \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "[?label=='blue'].revisionName | [0]" \
            -o tsv)

          echo "Current blue revision: $currentBlue"

          # Create new revision
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --image "$IMAGE"

          # Get the newly created revision
          latestRevision=$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query properties.latestRevisionName \
            -o tsv)

          echo "Latest revision: $latestRevision"

          # Wait for the new revision to become available
          while true; do
            provisionState=$(az containerapp revision show \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --revision "$latestRevision" \
              --query properties.provisioningState \
              -o tsv)

            echo "Revision state: $provisionState"

            if [ "$provisionState" = "Provisioned" ]; then
              break
            fi

            sleep 10
          done

          # Move previous blue revision to green
          if [ -n "$currentBlue" ]; then
            az containerapp revision label add \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --label green \
              --revision "$currentBlue" \
              --yes

            echo "Assigned green to previous blue revision: $currentBlue"
          fi

          # Assign blue to the new revision
          az containerapp revision label add \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --label blue \
            --revision "$latestRevision" \
            --yes

          echo "Assigned blue to new revision: $latestRevision"