name: Application Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ArtAuction.API/**"
      - "ArtAuction.Consumer/**"
      - "ArtAuction.Contract/**"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app:
          - dockerfile: ArtAuction.API/Dockerfile
            containerAppName: art-auction-api
            imageName: art-auction-api

          - dockerfile: ArtAuction.Consumer/Dockerfile
            containerAppName: art-auction-consumer
            imageName: art-auction-consumer

    steps:
      - uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image
        uses: azure/docker-login@v1
        with:
          login-server: ${{ vars.REGISTRY_LOGIN_SERVER }}
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - run: |
          docker build \
            -f ${{ matrix.app.dockerfile }} \
            -t ${{ vars.REGISTRY_LOGIN_SERVER }}/${{ matrix.app.imageName }}:${{ github.sha }} \
            .

          docker push \
            ${{ vars.REGISTRY_LOGIN_SERVER }}/${{ matrix.app.imageName }}:${{ github.sha }}

      - name: Deploy to Container App
        shell: bash
        run: |
          APP_NAME="${{ matrix.app.containerAppName }}"
          RG="${{ vars.RESOURCE_GROUP }}"
          IMAGE="${{ vars.REGISTRY_LOGIN_SERVER }}/${{ matrix.app.imageName }}:${{ github.sha }}"

          # Determine which label is currently live
          liveLabel=$(az containerapp ingress traffic show \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "[?weight==\`100\`].label | [0]" \
            -o tsv)

          echo "Current live label: $liveLabel"

          # Deploy to the opposite colour
          if [ "$liveLabel" = "blue" ]; then
            LABEL="green"
          else
            LABEL="blue"
          fi

          echo "Deploying new revision with label: $LABEL"

          # Create new revision
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --image "$IMAGE"

          # Get the newly created revision
          latestRevision=$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query properties.latestRevisionName \
            -o tsv)

          echo "Latest revision: $latestRevision"

          # Assign label to the new revision
          az containerapp revision label add \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --label "$LABEL" \
            --revision "$latestRevision" \
            --yes

          echo "Revision $latestRevision assigned label $LABEL"