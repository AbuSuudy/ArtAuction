name: Infra Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/Infra/**"

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    name: Lint Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Bicep templates
        run: az bicep lint --file src/Infra/main.bicep

  resolve-images:
    name: Resolve Current Container Images
    runs-on: ubuntu-latest
    outputs:
      overrides: ${{ steps.images.outputs.overrides }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve currently running container images
        id: images
        run: |
          set -euo pipefail

          RG="${{ vars.RESOURCE_GROUP }}"
          apps=(ca-artauctionapi-neu-001 ca-artauctionconsumer-neu-001)

          overrides="{}"
          #2>/dev/null
          #discard any error messages from the az CLI, so we can continue to deploy even if the apps don't exist yet.
          #2 = standard error (stderr) — where programs normally send error messages.
          #> = redirect output somewhere else.
          #/dev/null = a special file that discards anything sent to it.

          for app in "${apps[@]}"; do
            image=$(az containerapp show \
              --name "$app" \
              --resource-group "$RG" \
              --query "properties.template.containers[0].image" \
              -o tsv 2>/dev/null || true)

            # Skip apps that don't exist yet (first deploy) or are still on the
            # placeholder image, so the Bicep default takes over.
            if [[ -n "$image" && "$image" != *k8se/quickstart* ]]; then
              overrides=$(jq --arg k "$app" --arg v "$image" '. + {($k): $v}' <<< "$overrides")
              overrides=$(jq -c --arg k "$app" --arg v "$image" '. + {($k): $v}' <<< "$overrides")
            fi
          done

          echo "overrides=$overrides" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate Bicep Deployment
    needs: [lint, resolve-images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Bicep deployment
        uses: azure/bicep-deploy@v2
        with:
          type: deploymentStack
          operation: validate
          name: Development-RG-ARTAUCTION-NEU-001
          location: northeurope
          scope: subscription
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          template-file: src/Infra/main.bicep
          parameters-file: src/Infra/Params/main.bicepparam
          parameters: |
            imageOverrides: ${{ needs.resolve-images.outputs.overrides }}
          action-on-unmanage-resources: delete
          action-on-unmanage-resourcegroups: delete
          deny-settings-mode: none

  what-if:
    name: What-If Against Deployment Stack
    needs: [lint, resolve-images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: What-if against the deployment stack
        uses: azure/bicep-deploy@v2
        with:
          type: deployment
          operation: whatIf
          name: Development-RG-ARTAUCTION-NEU-001
          location: northeurope
          scope: subscription
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          template-file: src/Infra/main.bicep
          parameters-file: src/Infra/Params/main.bicepparam
          validation-level: provider

  deploy:
    name: Deploy Infrastructure
    needs: [lint, resolve-images, validate, what-if]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Bicep Deployment
        uses: azure/bicep-deploy@v2
        with:
          type: deploymentStack
          operation: create
          name: Development-RG-ARTAUCTION-NEU-001
          location: northeurope
          scope: subscription
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          template-file: src/Infra/main.bicep
          parameters-file: src/Infra/Params/main.bicepparam
          parameters: |
            imageOverrides: ${{ needs.resolve-images.outputs.overrides }}
          action-on-unmanage-resources: delete
          action-on-unmanage-resourcegroups: delete
          deny-settings-mode: none
