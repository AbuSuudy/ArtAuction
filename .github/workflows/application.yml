name: Application Pipeline

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Manage container traffic"
        required: true
        type: choice
        options:
          - build
          - promote
          - rollback
      app_name:
        description: "Container app to update (leave blank for build to build all apps)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - art-auction-api
          - art-auction-consumer
  push:
    branches:
      - main
    paths:
      - "ArtAuction.API/**"
      - "ArtAuction.Consumer/**"
      - "ArtAuction.Contract/**"

concurrency:
  group: containerapp-${{ github.event.inputs.app_name || 'push' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'build')
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app:
          - dockerfile: ArtAuction.API/Dockerfile
            containerAppName: art-auction-api
            imageName: art-auction-api

          - dockerfile: ArtAuction.Consumer/Dockerfile
            containerAppName: art-auction-consumer
            imageName: art-auction-consumer

    steps:
      - uses: actions/checkout@v3

      - name: Log in to Azure
        if: github.event_name == 'push' || github.event.inputs.app_name == '' || github.event.inputs.app_name == matrix.app.containerAppName
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to container registry
        if: github.event_name == 'push' || github.event.inputs.app_name == '' || github.event.inputs.app_name == matrix.app.containerAppName
        uses: azure/docker-login@v1
        with:
          login-server: ${{ vars.REGISTRY_LOGIN_SERVER }}
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        if: github.event_name == 'push' || github.event.inputs.app_name == '' || github.event.inputs.app_name == matrix.app.containerAppName
        run: |
          docker build \
            -f ${{ matrix.app.dockerfile }} \
            -t ${{ vars.REGISTRY_LOGIN_SERVER }}/${{ matrix.app.imageName }}:${{ github.sha }} \
            .

          docker push \
            ${{ vars.REGISTRY_LOGIN_SERVER }}/${{ matrix.app.imageName }}:${{ github.sha }}

      - name: Deploy to Container App
        if: github.event_name == 'push' || github.event.inputs.app_name == '' || github.event.inputs.app_name == matrix.app.containerAppName
        shell: bash
        run: |
          set -euo pipefail

          APP_NAME="${{ matrix.app.containerAppName }}"
          RG="${{ vars.RESOURCE_GROUP }}"
          IMAGE="${{ vars.REGISTRY_LOGIN_SERVER }}/${{ matrix.app.imageName }}:${{ github.sha }}"

          # Get current Blue/Green revisions
          blue=$(az containerapp ingress traffic show \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "[?label=='blue'].revisionName | [0]" \
            -o tsv || true)

          green=$(az containerapp ingress traffic show \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "[?label=='green'].revisionName | [0]" \
            -o tsv || true)

          # Decide which slot receives the deployment
          if [[ -z "$blue" && -z "$green" ]]; then
            # First deployment
            deploy_label="blue"
            previous_label="none"

          elif [[ -n "$blue" && -z "$green" ]]; then
            # Second Deployment: Blue exists, so deploy to Green
            deploy_label="green"
            previous_label="blue"

          else
            # Both exist - deploy to the older slot
            blue_created=$(az containerapp revision show \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --revision "$blue" \
              --query "properties.createdTime" \
              -o tsv)

            green_created=$(az containerapp revision show \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --revision "$green" \
              --query "properties.createdTime" \
              -o tsv)

            deploy_label=$([[ "$blue_created" < "$green_created" ]] && echo "blue" || echo "green")
            previous_label=$([[ "$blue_created" < "$green_created" ]] && echo "green" || echo "blue")

          fi

          echo "Deploying to: $deploy_label"
          echo "Current production slot: $previous_label"

          # Remember the current latest revision
          previous_revision_name=$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "properties.latestRevisionName" \
            -o tsv)
          echo "Previous latest revision: $previous_revision_name"

          # Deploy the new image
          echo "Updating container app $APP_NAME with image $IMAGE"
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --image "$IMAGE"

          # Wait for a new revision to appear
          latest=""

          echo "Waiting for new revision to be provisioned..."
          for _ in {1..60}; do
            latest=$(az containerapp show \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --query "properties.latestRevisionName" \
              -o tsv)

            if [[ -n "$latest" && "$latest" != "$previous_revision_name" ]] && \
               [[ "$(az containerapp revision show \
                      --name "$APP_NAME" \
                      --resource-group "$RG" \
                      --revision "$latest" \
                      --query "properties.provisioningState" \
                      -o tsv)" == "Provisioned" ]]; then
              break
            fi

            sleep 5
          done

          if [[ -z "$latest" || "$latest" == "$previous_revision_name" ]]; then
            echo "::error::Timed out waiting for a new revision to provision for $APP_NAME"
            exit 1
          fi

          echo "New revision provisioned: $latest"
          # Assign Blue/Green label to the new revision
          az containerapp revision label add \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --label "$deploy_label" \
            --revision "$latest" \
            --yes

          # Keep the new revision at 0% traffic until promoted; production slot stays at 100%
          if [[ "$previous_label" != "none" ]]; then
            az containerapp ingress traffic set \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --revision-weight "$previous_revision_name=100"

            echo "Keeping traffic on previous revision: $previous_revision_name"
          else
            # First deployment ever - nothing to keep traffic on, so the new revision serves 100%
            az containerapp ingress traffic set \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --revision-weight "$latest=100"

            echo "First deployment - setting traffic to new revision: $latest"
          fi

          # echo "Cleaning up old revisions"
          for revision in $(az containerapp revision list \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "[].name" \
            -o tsv); do

            label=$(az containerapp show \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --query "properties.configuration.ingress.traffic[?revisionName=='$revision'].label | [0]" \
              -o tsv)

            if [[ "$label" != "blue" && "$label" != "green" ]]; then
              echo "Deactivating $revision (label: ${label:-none})"

              az containerapp revision deactivate \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --revision "$revision"
            fi
          done


          echo "Deployment complete"
          echo "Blue:  ${blue:-<none>}"
          echo "Green: ${green:-<none>}"
          echo "New:   $latest"

  promote:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'promote' && github.event.inputs.app_name != ''
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Promote latest revision to 100%
        shell: bash
        run: |
          set -euo pipefail

          APP_NAME="${{ github.event.inputs.app_name }}"
          RG="${{ vars.RESOURCE_GROUP }}"

          latest=$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "properties.latestRevisionName" \
            -o tsv)

          latest_label=$(az containerapp ingress traffic show \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "[?revisionName=='$latest'].label | [0]" \
            -o tsv || true)

          if [[ -z "$latest_label" ]]; then
            echo "::error::Latest revision $latest has no blue/green label - refusing to promote"
            exit 1
          fi

          echo "Promoting: routing 100% traffic to $latest (label: $latest_label)"

          az containerapp ingress traffic set \
            --name "$APP_NAME" --resource-group "$RG" \
            --revision-weight "$latest=100"

          echo "Promote done. $latest is now serving 100% of traffic."

  rollback:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback' && github.event.inputs.app_name != ''
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Rollback to the other blue/green slot
        shell: bash
        run: |
          set -euo pipefail

          APP_NAME="${{ github.event.inputs.app_name }}"
          RG="${{ vars.RESOURCE_GROUP }}"

          blue=$(az containerapp ingress traffic show \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "[?label=='blue'].revisionName | [0]" \
            -o tsv || true)

          green=$(az containerapp ingress traffic show \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "[?label=='green'].revisionName | [0]" \
            -o tsv || true)

          if [[ -z "$blue" || -z "$green" ]]; then
            echo "::error::Both a blue and green revision must exist to roll back (blue=${blue:-<none>}, green=${green:-<none>})"
            exit 1
          fi

          blue_weight=$(az containerapp ingress traffic show \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "[?label=='blue'].weight | [0]" \
            -o tsv || echo 0)

          green_weight=$(az containerapp ingress traffic show \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "[?label=='green'].weight | [0]" \
            -o tsv || echo 0)

          if [[ "$blue_weight" == "100" ]]; then
            target_label="green"
            target_revision="$green"
          elif [[ "$green_weight" == "100" ]]; then
            target_label="blue"
            target_revision="$blue"
          else
            echo "::error::Traffic is split or ambiguous (blue=${blue_weight}%, green=${green_weight}%) - refusing to guess a rollback target"
            exit 1
          fi

          echo "Rolling back: routing 100% traffic to $target_label revision $target_revision"

          az containerapp ingress traffic set \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --revision-weight "$target_revision=100"

          echo "Rollback done. $target_revision ($target_label) is now serving 100% of traffic."
