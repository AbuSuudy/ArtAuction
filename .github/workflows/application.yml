name: Application Pipeline

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Manage container traffic"
        required: true
        type: choice
        options:
          - build
          - switch_traffic
      app_name:
        description: "Container app to update"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - art-auction-api
          - art-auction-consumer
  push:
    branches:
      - main
    paths:
      - "ArtAuction.API/**"
      - "ArtAuction.Consumer/**"
      - "ArtAuction.Contract/**"

jobs:
  build:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'build')
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app:
          - dockerfile: ArtAuction.API/Dockerfile
            containerAppName: art-auction-api
            imageName: art-auction-api

          - dockerfile: ArtAuction.Consumer/Dockerfile
            containerAppName: art-auction-consumer
            imageName: art-auction-consumer

    steps:
      - uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image
        uses: azure/docker-login@v1
        with:
          login-server: ${{ vars.REGISTRY_LOGIN_SERVER }}
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - run: |
          docker build \
            -f ${{ matrix.app.dockerfile }} \
            -t ${{ vars.REGISTRY_LOGIN_SERVER }}/${{ matrix.app.imageName }}:${{ github.sha }} \
            .

          docker push \
            ${{ vars.REGISTRY_LOGIN_SERVER }}/${{ matrix.app.imageName }}:${{ github.sha }}

      - name: Deploy to Container App
        shell: bash
        run: |
          set -euo pipefail

          APP_NAME="${{ matrix.app.containerAppName }}"
          RG="${{ vars.RESOURCE_GROUP }}"
          IMAGE="${{ vars.REGISTRY_LOGIN_SERVER }}/${{ matrix.app.imageName }}:${{ github.sha }}"

          # Get current Blue/Green revisions
          blue=$(az containerapp ingress traffic show \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "[?label=='blue'].revisionName | [0]" \
            -o tsv || true)

          # Decide which slot receives the deployment
          if [[ -z "$blue" ]]; then
            # First deployment
            deploy_label="blue"
            previous_label="none"

          else

            # Both exist - deploy to the weight to determin next slow
            blue_weight=$(az containerapp show \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --query "properties.configuration.ingress.traffic[?label=='blue'].weight | [0]" \
                -o tsv)

            green_weight=$(az containerapp show \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --query "properties.configuration.ingress.traffic[?label=='green'].weight | [0]" \
                -o tsv)

            if (( blue_weight < green_weight )); then
              deploy_label="blue"
              previous_label="green"
            else
              deploy_label="green"
              previous_label="blue"
            fi

          fi

          echo "Deploying to: $deploy_label"

          # Remember the current latest revision
          previous_revision_name=$(az containerapp revision list \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query '[?properties.trafficWeight==`100`].name | [0]' \
            -o tsv)
            
          echo "Previous latest revision: $previous_revision_name"

          # Deploy the new image
          echo "Updating container app $APP_NAME with image $IMAGE"
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --image "$IMAGE"

          # Wait for a new revision to appear
          latest=""

          echo "Waiting for new revision to be provisioned..."
          for _ in {1..60}; do
            latest=$(az containerapp show \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --query "properties.latestRevisionName" \
              -o tsv)

            if [[ -n "$latest" && "$latest" != "$previous_revision_name" ]] && \
               [[ "$(az containerapp revision show \
                      --name "$APP_NAME" \
                      --resource-group "$RG" \
                      --revision "$latest" \
                      --query "properties.provisioningState" \
                      -o tsv)" == "Provisioned" ]]; then          
              break
            fi

            sleep 5
          done

          echo "New revision provisioned: $latest"
          # Assign Blue/Green label to the new revision
          az containerapp revision label add \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --label "$deploy_label" \
            --revision "$latest" \
            --yes

          #Keep the previous production slot at 100% traffic
          if [[ "$previous_label" != "none" ]]; then

           az containerapp ingress traffic set \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --revision-weight "$previous_revision_name=100"

           echo "Setting traffic to previous revision: $previous_revision_name"

          fi

          # echo "Cleaning up old revisions"
          # for revision in $(az containerapp revision list \
          #   --name "$APP_NAME" \
          #   --resource-group "$RG" \
          #   --query "[].name" \
          #   -o tsv); do

          #   label=$(az containerapp show \
          #     --name "$APP_NAME" \
          #     --resource-group "$RG" \
          #     --query "properties.configuration.ingress.traffic[?revisionName=='$revision'].label | [0]" \
          #     -o tsv)

          #   if [[ "$label" != "blue" && "$label" != "green" ]]; then
          #     echo "Deactivating $revision (label: ${label:-none})"

          #     az containerapp revision deactivate \
          #       --name "$APP_NAME" \
          #       --resource-group "$RG" \
          #       --revision "$revision"
          #   fi
          # done

          echo "Deployment complete"
          echo "Blue:  ${blue:-<none>}"
          echo "Green: ${green:-<none>}"
          echo "New:   $latest"

  switch_traffic:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'promote' && github.event.inputs.app_name != ''
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Promote latest revision to 100%
        shell: bash
        run: |
          set -euo pipefail        
          
          APP_NAME="${{ github.event.inputs.app_name }}"
          RG="${{ vars.RESOURCE_GROUP }}"

          # Find the revision that is not currently serving 100% of traffic.
          candidate=$(az containerapp ingress traffic show \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "[?weight == \`0\`].revisionName | [0]" \
            -o tsv)

          if [[ -z "$candidate" ]]; then
            echo "No revision found with 0% traffic."
            exit 1
          fi

          echo "Promoting: routing 100% traffic to $candidate"

          az containerapp ingress traffic set \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --revision-weight "$candidate=100"
