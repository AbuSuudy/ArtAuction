name: Application Pipeline

# --- Blue/green deployment for Azure Container Apps -------------------------
# Each app is kept in "multiple" revision mode with two revision labels,
# "blue" and "green". Exactly one of them serves 100% of production traffic
# at any time. Every run:
#   1. builds the image and deploys it as a brand new revision at 0% traffic
#   2. labels that revision with whichever of blue/green is currently idle
#   3. only then swaps 100% of traffic onto it
#   4. deactivates the revision that lost its label two cycles ago
#
# Prerequisites this workflow assumes:
#   - art-auction-api and art-auction-consumer already exist as Container
#     Apps (this pipeline updates them, it does not provision them).
#   - Both have ingress enabled (external or internal) - blue/green traffic
#     splitting and labels are an ingress feature. If a given app has no
#     ingress at all, the smoke test is skipped automatically, but the
#     label/traffic steps still need ingress to mean anything - see the
#     note in this thread if that's the case for ArtAuction.Consumer.
#   - AZURE_CREDENTIALS already has rights to build in ACR and manage
#     Container Apps revisions/ingress (the same rights the previous
#     azure/container-apps-deploy-action step relied on).
# ------------------------------------------------------------------------

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ArtAuction.API/**"
      - "ArtAuction.Consumer/**"
      - "ArtAuction.Contract/**"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app:
          - dockerfile: ArtAuction.API/Dockerfile
            containerAppName: art-auction-api
            imageName: art-auction-api

          - dockerfile: ArtAuction.Consumer/Dockerfile
            containerAppName: art-auction-consumer
            imageName: art-auction-consumer

    env:
      RESOURCE_GROUP: MassTransit-Playground
      ACR_NAME: masstransitcontainerregistry
      APP_NAME: ${{ matrix.app.containerAppName }}
      IMAGE_NAME: ${{ matrix.app.imageName }}
      DOCKERFILE: ${{ matrix.app.dockerfile }}

    steps:
      - uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Container Apps CLI extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      # Blue/green needs multiple active revisions. Safe to run every time:
      # it's a no-op if the app is already in multiple mode.
      - name: Ensure multiple revision mode
        run: |
          az containerapp revision set-mode \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --mode multiple

      # Works out which label (blue/green) is currently live and which one
      # is free for this deployment. On the very first run under this
      # workflow neither label exists yet, so it bootstraps "blue" from
      # whatever revision is already serving traffic first - this also
      # replaces Azure's default "always route to latest" rule with an
      # explicit one, so the new revision we deploy later doesn't
      # automatically inherit production traffic before it's tested.
      - name: Determine blue/green target
        id: slot
        run: |
          set -euo pipefail

          TRAFFIC_JSON=$(az containerapp ingress traffic show \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" -o json)

          BG_LABEL_COUNT=$(echo "$TRAFFIC_JSON" | jq -r '[.[] | select(.label == "blue" or .label == "green")] | length')

          if [ "$BG_LABEL_COUNT" = "0" ]; then
            echo "No blue/green labels yet - bootstrapping 'blue' from the current production revision."
            ACTIVE_REVISION=$(az containerapp show \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --query "properties.latestReadyRevisionName" -o tsv)

            az containerapp revision label add \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --label blue \
              --revision "$ACTIVE_REVISION" \
              --yes

            az containerapp ingress traffic set \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --label-weight blue=100

            TRAFFIC_JSON=$(az containerapp ingress traffic show \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" -o json)
          fi

          CURRENT_LABEL=$(echo "$TRAFFIC_JSON" | jq -r '[.[] | select(.label != null and .weight == 100)][0].label // empty')

          if [ "$CURRENT_LABEL" = "blue" ]; then
            TARGET_LABEL=green
          else
            TARGET_LABEL=blue
          fi

          STALE_REVISION=$(echo "$TRAFFIC_JSON" | jq -r --arg L "$TARGET_LABEL" '[.[] | select(.label == $L)][0].revisionName // empty')

          echo "Current production label: ${CURRENT_LABEL:-none}"
          echo "This deploy will use label: $TARGET_LABEL"

          {
            echo "current_label=$CURRENT_LABEL"
            echo "target_label=$TARGET_LABEL"
            echo "stale_revision=$STALE_REVISION"
          } >> "$GITHUB_OUTPUT"

      - name: Build image in ACR
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "$IMAGE_NAME:$GITHUB_SHA" \
            --file "$DOCKERFILE" \
            --platform linux/amd64 \
            .

      # Creates a new revision without sending it any production traffic -
      # now that traffic is driven by explicit labels (not "latest"), a
      # fresh revision defaults to 0% until we label and promote it below.
      - name: Deploy new revision
        id: deploy
        run: |
          set -euo pipefail
          REVISION_SUFFIX="${GITHUB_SHA:0:7}"

          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/$IMAGE_NAME:$GITHUB_SHA" \
            --revision-suffix "$REVISION_SUFFIX"

          {
            echo "revision_suffix=$REVISION_SUFFIX"
            echo "revision_name=$APP_NAME--$REVISION_SUFFIX"
          } >> "$GITHUB_OUTPUT"

      - name: Label the new revision
        run: |
          az containerapp revision label add \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --label "${{ steps.slot.outputs.target_label }}" \
            --revision "${{ steps.deploy.outputs.revision_name }}" \
            --yes


      - name: Promote new revision to production
        run: |
          set -euo pipefail
          TARGET_LABEL="${{ steps.slot.outputs.target_label }}"
          CURRENT_LABEL="${{ steps.slot.outputs.current_label }}"

          if [ -n "$CURRENT_LABEL" ]; then
            # Set traffic to the target label first, then remove from current
            az containerapp ingress traffic set \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --revision-weight latest=100
      
            # Remove the label from the previous revision to ensure clean state
            CURRENT_REVISION=$(az containerapp ingress traffic show \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" -o json | \
              jq -r --arg L "$CURRENT_LABEL" '[.[] | select(.label == $L)][0].revisionName // empty')

            if [ -n "$CURRENT_REVISION" ]; then
              az containerapp revision label remove \
                --name "$APP_NAME" \
                --resource-group "$RESOURCE_GROUP" \
                --label "$CURRENT_LABEL" \
                --revision "$CURRENT_REVISION"
            fi
          else
            # Bootstrap case: just set the target label to 100%
            az containerapp ingress traffic set \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --label-weight "$TARGET_LABEL=100"
              --revision-weight latest=100
          fi

      # Tidies up the revision that lost its label two cycles ago so idle
      # active revisions don't quietly keep costing money. The revision
      # that just lost traffic in this cycle is left running so you can
      # still roll back to it instantly if something goes wrong.
      - name: Deactivate the stale revision
        if: steps.slot.outputs.stale_revision != ''
        run: |
          az containerapp revision deactivate \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \