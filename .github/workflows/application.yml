name: Application Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ArtAuction.API/**"
      - "ArtAuction.Consumer/**"
      - "ArtAuction.Contract/**"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app:
          - dockerfile: ArtAuction.API/Dockerfile
            containerAppName: art-auction-api
            imageName: art-auction-api

          - dockerfile: ArtAuction.Consumer/Dockerfile
            containerAppName: art-auction-consumer
            imageName: art-auction-consumer

    steps:
      - uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and deploy ${{ matrix.app.containerAppName }}
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: ${{ matrix.app.dockerfile }}
          acrName: masstransitcontainerregistry
          containerAppName: ${{ matrix.app.containerAppName }}
          resourceGroup: MassTransit-Playground
          imageToBuild: masstransitcontainerregistry.azurecr.io/${{ matrix.app.imageName }}:${{ github.sha }}
          dockerBuildArgs: --platform linux/amd64
