on:
  workflow_call:
    inputs:
      dockerfile:
        required: true
        type: string
      image-name:
        required: true
        type: string
    outputs:
      image:
        description: "Full image reference that was pushed"
        value: ${{ jobs.build.outputs.image }}

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Build & Test .NET Solution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ArtAuction.slnx

      - name: Build
        run: dotnet build ArtAuction.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test ArtAuction.slnx --no-build --configuration Release

  build:
    name: Build & Push Container Image
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name "${REGISTRY%%.*}"
        env:
          REGISTRY: ${{ vars.REGISTRY_LOGIN_SERVER }}

      - name: Build and push
        id: push
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          IMAGE: ${{ vars.REGISTRY_LOGIN_SERVER }}/${{ inputs.image-name }}:${{ github.sha }}
        run: |
          set -euo pipefail

          docker build -f "$DOCKERFILE" -t "$IMAGE" .
          docker push "$IMAGE"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
