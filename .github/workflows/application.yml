name: Application Pipeline

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Manage container traffic"
        required: true
        type: choice
        options:
          - build
          - switch_traffic
      app_name:
        description: "Container app to update"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - art-auction-api
          - art-auction-consumer

      revision_name:
        description: "Revision to send 100% traffic to"
        required: false
        default: ""
        type: string
  push:
    branches:
      - main
    paths:
      - "ArtAuction.API/**"
      - "ArtAuction.Consumer/**"
      - "ArtAuction.Contract/**"

jobs:
  build:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'build')
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app:
          - dockerfile: ArtAuction.API/Dockerfile
            containerAppName: art-auction-api
            imageName: art-auction-api

          - dockerfile: ArtAuction.Consumer/Dockerfile
            containerAppName: art-auction-consumer
            imageName: art-auction-consumer

    steps:
      - uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image
        uses: azure/docker-login@v1
        with:
          login-server: ${{ vars.REGISTRY_LOGIN_SERVER }}
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - run: |
          docker build \
            -f ${{ matrix.app.dockerfile }} \
            -t ${{ vars.REGISTRY_LOGIN_SERVER }}/${{ matrix.app.imageName }}:${{ github.sha }} \
            .

          docker push \
            ${{ vars.REGISTRY_LOGIN_SERVER }}/${{ matrix.app.imageName }}:${{ github.sha }}

      - name: Deploy to Container App
        shell: bash
        run: |
          set -euo pipefail

          APP_NAME="${{ matrix.app.containerAppName }}"
          RG="${{ vars.RESOURCE_GROUP }}"
          IMAGE="${{ vars.REGISTRY_LOGIN_SERVER }}/${{ matrix.app.imageName }}:${{ github.sha }}"

          # Get current Blue/Green revisions
          blue=$(az containerapp ingress traffic show \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "[?label=='blue'].revisionName | [0]" \
            -o tsv || true)

          # Decide which slot receives the deployment
          if [[ -z "$blue" ]]; then
            # First deployment
            deploy_label="blue"
            previous_label="none"

          else

            # Both exist - deploy to the weight to determin next slow
            blue_weight=$(az containerapp show \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --query "properties.configuration.ingress.traffic[?label=='blue'].weight | [0]" \
                -o tsv)

            green_weight=$(az containerapp show \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --query "properties.configuration.ingress.traffic[?label=='green'].weight | [0]" \
                -o tsv)

            deploy_label=$(( blue_weight == 100)) && deploy_label="green" || deploy_label="blue"
            previous_label=$([[ "$deploy_label" == "blue" ]] && echo "green" || echo "blue")

          fi

          echo "Deploying to: $deploy_label"

          # Remember the current latest revision
          previous_revision_name=$(az containerapp revision list \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query '[?properties.trafficWeight==`100`].name | [0]' \
            -o tsv)
            
          echo "Previous latest revision: $previous_revision_name"

          # Deploy the new image
          echo "Updating container app $APP_NAME with image $IMAGE"
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --image "$IMAGE"

        
          #Keep the previous production slot at 100% traffic
          if [[ "$previous_label" != "none" ]]; then

           az containerapp ingress traffic set \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --revision-weight "$previous_revision_name=100"

           echo "Setting traffic to previous revision: $previous_revision_name"

          fi

          # Wait for a new revision to appear
          latest=""

          echo "Waiting for new revision to be provisioned..."
          for _ in {1..60}; do
            latest=$(az containerapp show \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --query "properties.latestRevisionName" \
              -o tsv)

            if [[ -n "$latest" && "$latest" != "$previous_revision_name" ]] && \
               [[ "$(az containerapp revision show \
                      --name "$APP_NAME" \
                      --resource-group "$RG" \
                      --revision "$latest" \
                      --query "properties.provisioningState" \
                      -o tsv)" == "Provisioned" ]]; then          
              break
            fi

            sleep 5
          done

          echo "New revision provisioned: $latest"
          # Assign Blue/Green label to the new revision
          az containerapp revision label add \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --label "$deploy_label" \
            --revision "$latest" \
            --yes

          echo "Cleaning up revisions older than 5 days"
          cutoff=$(date -u -d '5 days ago' +%s)

          az containerapp revision list \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "[?properties.active].[name, properties.createdTime]" \
            -o tsv |
          while IFS=$'\t' read -r revision created; do
            if (( $(date -u -d "$created" +%s) < cutoff )); then
              echo "Deactivating $revision (created $created)"
              az containerapp revision deactivate \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --revision "$revision"
            fi
          done

          echo "Deployment complete"
          echo "Blue:  ${blue:-<none>}"
          echo "Green: ${green:-<none>}"
          echo "New:   $latest"

  switch_traffic:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'switch_traffic' && github.event.inputs.app_name != ''
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Promote latest revision to 100%
        shell: bash
        run: |
          set -euo pipefail

          APP_NAME="${{ github.event.inputs.app_name }}"
          REVISION_NAME="${{ github.event.inputs.revision_name }}"
          RG="${{ vars.RESOURCE_GROUP }}"

          # Read current weights BEFORE changing traffic
          blue_weight=$(az containerapp show -n "$APP_NAME" -g "$RG" \
            --query "properties.configuration.ingress.traffic[?label=='blue'].weight | [0]" -o tsv)
          green_weight=$(az containerapp show -n "$APP_NAME" -g "$RG" \
            --query "properties.configuration.ingress.traffic[?label=='green'].weight | [0]" -o tsv)

          blue_weight=${blue_weight:-0}
          green_weight=${green_weight:-0}

          # Whichever color is live now, the new revision gets the other one
          if (( blue_weight > green_weight )); then
            deploy_label="green"
          else
            deploy_label="blue"
          fi
          echo "blue=$blue_weight green=$green_weight -> labelling $REVISION_NAME as $deploy_label"

          # All active revisions -> 0, target -> 100
          ZEROED=$(az containerapp revision list -n "$APP_NAME" -g "$RG" \
            --query "[?properties.active && name != '$REVISION_NAME'].name" -o tsv | sed 's/$/=0/')

          az containerapp ingress traffic set -n "$APP_NAME" -g "$RG" \
            --revision-weight latest=0 $ZEROED "$REVISION_NAME=100"

          az containerapp revision label add \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --label "$deploy_label" \
            --revision "$REVISION_NAME" \
            --yes